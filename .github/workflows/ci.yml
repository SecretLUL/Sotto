name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The runner's screen is 1024x768, too small for the window to open at
      # full height; the layout tests that need the room skip themselves there.
      - name: Give the screen room for the window
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop }
          catch { Write-Warning "Could not change the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          "Screen: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Size

      - name: Run test suite
        run: python run_tests.py

  test-linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install PortAudio, Tkinter and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev python3-tk xvfb

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Guards the exact regression that shipped two broken release assets:
      # ui/app.py used to import pyaudiowpatch unconditionally, which only
      # exists on Windows, and Pillow was missing from requirements.txt. Both
      # blow up at import time, long before any test asserts anything - and no
      # test imports this module unless a display is available.
      - name: Import check (non-Windows startup path)
        run: python -c "import audio_transcriber.ui.app; print('ui.app imports cleanly')"

      # xvfb so the GUI smoke test actually runs instead of skipping itself.
      - name: Run test suite
        run: xvfb-run -a python run_tests.py
