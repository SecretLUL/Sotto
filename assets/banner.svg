  <path d="M 790 124 H 1200" stroke="#2a2f3d" stroke-width="1.5"/>
  <g font-family="ui-monospace, 'Cascadia Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14">
    <text x="814" y="166" textLength="252" lengthAdjust="spacingAndGlyphs"><tspan fill="#64748b">[00:04] </tspan><tspan fill="#38bdf8">[You]:</tspan><tspan fill="#e2e8f0"> Shall we start?</tspan></text>
    <text x="814" y="202" textLength="319.2" lengthAdjust="spacingAndGlyphs"><tspan fill="#64748b">[00:06] </tspan><tspan fill="#34d399">[Participant]:</tspan><tspan fill="#e2e8f0"> Sure, go ahead.</tspan></text>
    <text x="814" y="238" textLength="285.6" lengthAdjust="spacingAndGlyphs"><tspan fill="#64748b">[00:09] </tspan><tspan fill="#38bdf8">[You]:</tspan><tspan fill="#e2e8f0"> The build is green.</tspan></text>
    <text x="814" y="274" textLength="352.8" lengthAdjust="spacingAndGlyphs"><tspan fill="#64748b">[00:12] </tspan><tspan fill="#34d399">[Participant]:</tspan><tspan fill="#e2e8f0"> Then let&#8217;s ship it.</tspan></text>
  </g>
