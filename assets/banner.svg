  <rect x="0.75" y="0.75" width="1278.5" height="398.5" rx="23.25" fill="none" stroke="#2a2f3d" stroke-width="1.5"/>

  <!-- Mark and name -->
  <g transform="translate(84 86) scale(0.26)">
    <defs>
      <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#232838"/>
        <stop offset="1" stop-color="#0a0c0e"/>
      </linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
        <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
      </radialGradient>
      <!-- your voice -->
      <linearGradient id="you" gradientUnits="userSpaceOnUse" x1="0" y1="108" x2="0" y2="256">
        <stop offset="0" stop-color="#7dd3fc"/>
        <stop offset="1" stop-color="#38bdf8"/>
      </linearGradient>
      <!-- everyone else -->
